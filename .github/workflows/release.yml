name: Semantic Release

# On push to main, parse conventional commits since the last tag,
# create a matching semver tag (vX.Y.Z), and build & push a
# semver-tagged Docker image to GHCR.
#
# The image is built HERE (not in ci.yml) because the tag is pushed
# with the default GITHUB_TOKEN, whose activity does not trigger
# downstream workflows — so ci.yml's `tags: ["v*"]` trigger never
# fires for auto-created tags.
#
# workflow_dispatch lets you (re)build the image for an existing tag,
# e.g. to publish 0.1.0 / 0.1 / 0 for an already-created v0.1.0 tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target version
        id: bump
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # --- Manual dispatch: build an already-existing tag verbatim ---
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
            echo "Manual build requested for tag $INPUT_TAG (version $VERSION)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Auto path: compute next semver from conventional commits ---
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          else
            echo "No previous tag — this is the first release"
            LAST_TAG="v0.1.0"
            COMMITS=$(git log HEAD --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          fi
          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LAST_TAG — nothing to release"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          while IFS= read -r line; do
            if echo "$line" | grep -qiE '(BREAKING[ -]CHANGE|^[a-z]+(\(.*\))?!:)'; then
              BUMP="major"
              echo "  → major (found: $line)"
              continue
            fi
            if [ "$BUMP" != "major" ] && echo "$line" | grep -qiE '^(feat|feature)(\(.*\))?:'; then
              BUMP="minor"
              echo "  → minor (found: $line)"
            fi
          done <<< "$COMMITS"

          echo "Bump type: $BUMP"

          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION:-0.0.0}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New version: $NEW_TAG"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.bump.outputs.released == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
          echo "✅ Published ${{ steps.bump.outputs.tag }}"

  docker:
    name: Build & Push Docker (semver)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Install current QEMU for the arm64 leg — the runner's preinstalled
      # binfmt QEMU intermittently kills Node with "uncaught target signal 4
      # (Illegal instruction)" during `npm ci` under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          IMAGE="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$MAJOR.$MINOR"
            echo "$IMAGE:$MAJOR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ needs.release.outputs.version }},org.opencontainers.image.revision=${{ needs.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
