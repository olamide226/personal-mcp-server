name: Semantic Release

# On push to main, parse conventional commits since the last tag
# and create a matching semver tag (v1.2.3).

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next semantic version
        id: bump
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          else
            echo "No previous tag — this is the first release"
            LAST_TAG="v0.0.0"
            COMMITS=$(git log HEAD --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          fi
          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LAST_TAG — nothing to release"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          while IFS= read -r line; do
            if echo "$line" | grep -qiE '(BREAKING[ -]CHANGE|^[a-z]+(\(.*\))?!:)'; then
              BUMP="major"
              echo "  → major (found: $line)"
              continue
            fi
            if [ "$BUMP" != "major" ] && echo "$line" | grep -qiE '^(feat|feature)(\(.*\))?:'; then
              BUMP="minor"
              echo "  → minor (found: $line)"
            fi
          done <<< "$COMMITS"

          echo "Bump type: $BUMP"

          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION:-0.0.0}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New version: $NEW_TAG"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.bump.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
          echo "✅ Published ${{ steps.bump.outputs.tag }}"
